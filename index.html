    <script id="ol3d-module-3d-script">
      (function() {
        var DEFAULT_TARGET_FILTER = 'ALL';
        var DEFAULT_TARGET_BBOX = [0.54, 0.125, 0.36];

        function configureTextureColorAndAnisotropy(THREE, tex, maxAniso) {
          if (!tex) return tex;
          if (THREE.SRGBColorSpace) {
            tex.colorSpace = THREE.SRGBColorSpace;
          }
          tex.anisotropy = maxAniso || 8;
          tex.needsUpdate = true;
          return tex;
        }

        function createRoundedBoxGeometry(THREE, w, h, d, radius, bevel) {
          var r = Math.min(radius || 0.004, w * 0.4, d * 0.4);
          var b = Math.min(bevel || 0.0015, r * 0.5, h * 0.25);
          var hw = w / 2 - b;
          var hd = d / 2 - b;
          var shape = new THREE.Shape();
          shape.moveTo(-hw + r, -hd);
          shape.lineTo(hw - r, -hd);
          shape.quadraticCurveTo(hw, -hd, hw, -hd + r);
          shape.lineTo(hw, hd - r);
          shape.quadraticCurveTo(hw, hd, hw - r, hd);
          shape.lineTo(-hw + r, hd);
          shape.quadraticCurveTo(-hw, hd, -hw, hd - r);
          shape.lineTo(-hw, -hd + r);
          shape.quadraticCurveTo(-hw, -hd, -hw + r, -hd);

          var extrudeSettings = {
            depth: Math.max(0.001, h - 2 * b),
            bevelEnabled: true,
            bevelSegments: 4,
            steps: 1,
            bevelSize: b,
            bevelThickness: b
          };
          var geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
          geo.rotateX(-Math.PI / 2);
          geo.computeBoundingBox();
          var minY = geo.boundingBox.min.y;
          geo.translate(0, -minY, 0);
          geo.computeVertexNormals();
          return geo;
        }

        function createBananaSocket(THREE, id, label, colorHex, x, y, z, tiltX) {
          var sockGroup = new THREE.Group();
          sockGroup.name = 'terminal_' + id;

          baseWasher.position.y = 0.0015;
          sockGroup.add(baseWasher);

          var insMat = new THREE.MeshPhysicalMaterial({
            color: colorHex,
            roughness: 0.25,
            metalness: 0.08,
            clearcoat: 0.5
          });
          var insBody = new THREE.Mesh(new THREE.CylinderGeometry(0.0062, 0.0068, 0.013, 24), insMat);
          insBody.position.y = 0.009;

          var ringGeo = new THREE.TorusGeometry(0.0036, 0.0011, 10, 24);
          ringGeo.rotateX(Math.PI / 2);

          ringMesh.position.y = 0.0156;

          hlRing.rotation.x = -Math.PI / 2;
          hlRing.position.y = 0.0165;
          hlRing.name = 'socket_highlight';
          sockGroup.add(hlRing);

          sockGroup.userData = {
            isTerminal: true,

          return sockGroup;
        }

        function drawMeterDialCanvas(canvas, type) {
          var ctx = canvas.getContext('2d');
          var w = canvas.width;
          var h = canvas.height;
          ctx.clearRect(0, 0, w, h);

          ctx.fillStyle = '#f8fafc';
          ctx.fillRect(0, 0, w, h);

          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 4;
          ctx.strokeRect(4, 4, w - 8, h - 8);

          var cx = w / 2;
          var cy = h * 0.86;
          var rOuter = w * 0.40;
          var rMirror = w * 0.31;
          var rInner = w * 0.25;

          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, rMirror + 10, -Math.PI * 0.78, -Math.PI * 0.22);
          ctx.arc(cx, cy, rMirror - 10, -Math.PI * 0.22, -Math.PI * 0.78, true);
          ctx.closePath();
          var grad = ctx.createLinearGradient(cx - 120, cy - 120, cx + 120, cy - 80);
          grad.addColorStop(0, '#cbd5e1');
          grad.addColorStop(0.5, '#f1f5f9');
          grad.addColorStop(1, '#94a3b8');
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.restore();

          var startAng = -Math.PI * 0.76;
          var endAng = -Math.PI * 0.24;
          var totalSpan = endAng - startAng;

          ctx.beginPath();
          ctx.arc(cx, cy, rOuter, startAng, endAng);
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(cx, cy, rInner, startAng, endAng);
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          var ticks = 30;
          for (var i = 0; i <= ticks; i++) {
            var frac = i / ticks;
            var ang = startAng + frac * totalSpan;
            var cos = Math.cos(ang);
            var sin = Math.sin(ang);
            var isMajor = (i % 5 === 0);

            var lenOut = isMajor ? 18 : 9;
            ctx.beginPath();
            ctx.moveTo(cx + cos * rOuter, cy + sin * rOuter);
            ctx.lineTo(cx + cos * (rOuter + lenOut), cy + sin * (rOuter + lenOut));
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = isMajor ? 3.0 : 1.5;
            ctx.stroke();

            var lenIn = isMajor ? 14 : 7;
            ctx.beginPath();
            ctx.moveTo(cx + cos * rInner, cy + sin * rInner);
            ctx.lineTo(cx + cos * (rInner - lenIn), cy + sin * (rInner - lenIn));
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = isMajor ? 2.4 : 1.2;
            ctx.stroke();

            if (isMajor) {
              var stepIdx = i / 5;
              var topLabel = type === 'A' ? (stepIdx * 0.5).toFixed(stepIdx % 2 === 0 ? 0 : 1) : (stepIdx * 2).toString();
              var botLabel = type === 'A' ? (stepIdx * 0.1).toFixed(1) : (stepIdx * 1).toString();
              if (stepIdx === 0) { topLabel = '0'; botLabel = '0'; }

              ctx.save();
              ctx.translate(cx + cos * (rOuter + 32), cy + sin * (rOuter + 32));
              ctx.rotate(ang + Math.PI / 2);
              ctx.fillStyle = '#0f172a';
              ctx.font = 'bold 20px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(topLabel, 0, 0);
              ctx.restore();

              ctx.save();
              ctx.translate(cx + cos * (rInner - 26), cy + sin * (rInner - 26));
              ctx.rotate(ang + Math.PI / 2);
              ctx.fillStyle = '#334155';
              ctx.font = 'bold 16px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(botLabel, 0, 4);
              ctx.restore();
            }
          }

          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 44px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(type, cx, cy - rInner * 0.42);
          ctx.fillRect(cx - 18, cy - rInner * 0.34, 36, 4);

          ctx.fillStyle = '#475569';
          ctx.font = 'bold 15px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText('Cấp 2.5  ⊥', w - 26, h - 38);
          ctx.textAlign = 'left';
          ctx.fillText('DC NO.2026', 26, h - 38);

          ctx.beginPath();
          ctx.arc(cx, cy, 42, Math.PI, 0);
          ctx.fillStyle = '#64748b';
          ctx.fill();
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // 1. Giá đỡ pin (Battery Holder): SLOT_1 (trên: z = -0.022), SLOT_2 (dưới: z = +0.022)
        // Khay 1: BAT1_POS (Đỏ, trái-trên) và BAT1_NEG (Đen, phải-trên hoặc trái-dưới theo quy ước 4 góc)

        function buildBatteryHolderUnit(THREE) {

          });
          var baseGeo = createRoundedBoxGeometry(THREE, 0.140, 0.012, 0.088, 0.005, 0.0015);
          var baseMesh = new THREE.Mesh(baseGeo, acrylicMat);
          baseMesh.name = 'body';
          unit.add(baseMesh);

          var wallMat = new THREE.MeshPhysicalMaterial({
            color: 0xf1f5f9,

          });
          var leftWall = new THREE.Mesh(createRoundedBoxGeometry(THREE, 0.018, 0.028, 0.086, 0.003, 0.001), wallMat);
          leftWall.position.set(-0.060, 0.012, 0);
          unit.add(leftWall);

          var metalMat = new THREE.MeshPhysicalMaterial({

        // 2. Viên Pin Đại Con Ó 1.5V (SLOT_1 ở z = -0.022, SLOT_2 ở z = +0.022)

            color: 0xe2e8f0,

            slotZ: index === 1 ? -0.022 : 0.022

        function buildBananaWireMesh(THREE, wireId, posA, posB, colorHex, wireIndex) {
          var wireGroup = new THREE.Group();
          wireGroup.name = 'wire_' + wireId;

          var plugMat = new THREE.MeshPhysicalMaterial({
            color: colorHex,
            roughness: 0.24,
            metalness: 0.08,
            clearcoat: 0.55
          });
          var metalTipMat = new THREE.MeshPhysicalMaterial({
            color: 0xe2e8f0,
            metalness: 0.95,
            roughness: 0.12
          });
          var holeMat = new THREE.MeshBasicMaterial({ color: 0x090d16 });

          function createBananaPlugHead(pos) {
            var pGroup = new THREE.Group();
            pGroup.position.copy(pos);
            var pin = new THREE.Mesh(new THREE.CylinderGeometry(0.0024, 0.0020, 0.012, 14), metalTipMat);
            pin.position.y = 0.010;
            pGroup.add(pin);
            var shroud = new THREE.Mesh(new THREE.CylinderGeometry(0.0044, 0.0044, 0.020, 18), plugMat);
            shroud.position.y = 0.025;
            pGroup.add(shroud);
            var crossHole = new THREE.Mesh(new THREE.CylinderGeometry(0.0018, 0.0018, 0.0092, 12), holeMat);
            crossHole.rotation.z = Math.PI / 2;
            crossHole.position.y = 0.023;
            pGroup.add(crossHole);
            return pGroup;
          }

          wireGroup.add(createBananaPlugHead(posA));
          wireGroup.add(createBananaPlugHead(posB));

          var p0 = new THREE.Vector3(posA.x, posA.y + 0.034, posA.z);
          var p4 = new THREE.Vector3(posB.x, posB.y + 0.034, posB.z);
          var dist = p0.distanceTo(p4);
          var archH = Math.min(0.065, Math.max(0.022, dist * 0.24)) + (wireIndex % 3) * 0.006;

          var p1 = new THREE.Vector3(
            p0.x + (p4.x - p0.x) * 0.22,
            Math.max(p0.y, p4.y) + archH * 0.75,
            p0.z + (p4.z - p0.z) * 0.22
          );
          var p2 = new THREE.Vector3(
            (p0.x + p4.x) * 0.5,
            Math.max(p0.y, p4.y) + archH,
            (p0.z + p4.z) * 0.5 + ((wireIndex % 2 === 0 ? 1 : -1) * 0.012)
          );
          var p3 = new THREE.Vector3(
            p0.x + (p4.x - p0.x) * 0.78,
            Math.max(p0.y, p4.y) + archH * 0.75,
            p0.z + (p4.z - p0.z) * 0.78
          );

          var curve = new THREE.CatmullRomCurve3([p0, p1, p2, p3, p4]);
          var tubeGeo = new THREE.TubeGeometry(curve, 28, 0.0023, 10, false);
          var cableMat = new THREE.MeshPhysicalMaterial({
            color: colorHex,
            roughness: 0.30,
            metalness: 0.05,
            clearcoat: 0.45
          });
          var tubeMesh = new THREE.Mesh(tubeGeo, cableMat);
          tubeMesh.name = 'wire_cable_mesh';
          wireGroup.add(tubeMesh);

          wireGroup.userData = {
            isWire: true,
            wireId: wireId,
            colorHex: colorHex
          };
          return wireGroup;
        }

        function getTerminalLocalPos(rootObject, terminalId) {
          var ud = rootObject && rootObject.userData ? rootObject.userData : null;
          if (!ud || !ud.componentsGroup) return null;
          var target = ud.componentsGroup.getObjectByName('terminal_' + terminalId);
          if (!target || !target.parent || !target.parent.visible) return null;
          var pos = new ud.THREE_REF.Vector3();
          pos.copy(target.position);
          pos.add(target.parent.position);
          return pos;
        }

        function rebuildWires3D(rootObject, wireList) {
          var ud = rootObject && rootObject.userData ? rootObject.userData : null;
          if (!ud || !ud.wiresGroup || !Array.isArray(wireList)) return;
          while (ud.wiresGroup.children.length > 0) {
            var old = ud.wiresGroup.children[0];
            ud.wiresGroup.remove(old);
          }
          for (var i = 0; i < wireList.length; i++) {
            var w = wireList[i];
            var pA = getTerminalLocalPos(rootObject, w.from);
            var pB = getTerminalLocalPos(rootObject, w.to);
            if (pA && pB) {
              var mesh = ud.buildBananaWireMesh(ud.THREE_REF, w.id, pA, pB, w.color, i);
              mesh.userData.from = w.from;
              mesh.userData.to = w.to;
              ud.wiresGroup.add(mesh);
            }
          }
        }

          var scaleDisplay = new THREE.Mesh(new THREE.PlaneGeometry(0.144, 0.050), dispMat);

          root.userData = {

            units: {

            },
            screenCanvas: screenCanvas,

            drawReadoutCanvas: drawReadoutCanvas,
            buildBananaWireMesh: buildBananaWireMesh,
            lastSignature: ''
          };

          if (activeFilter === 'ALL') {
            var defaultWires = [
              { id: 'w0', from: 'BAT1_NEG', to: 'BAT2_POS', color: 0xef4444 },
              { id: 'w1', from: 'BAT1_POS', to: 'SW_RED', color: 0xef4444 },
              { id: 'w2', from: 'SW_GREEN', to: 'RHEO_IN', color: 0xef4444 },

              { id: 'w4', from: 'AM_NEG', to: 'BULB_POS', color: 0x2563eb },
              { id: 'w5', from: 'BULB_NEG', to: 'BAT2_NEG', color: 0x2563eb },
              { id: 'w6', from: 'BULB_POS', to: 'VM_6V', color: 0xef4444 },

            rebuildWires3D(root, defaultWires);

            root.remove(standPost);
            var targetW = DEFAULT_TARGET_BBOX[0] || 0.12;
            var targetH = DEFAULT_TARGET_BBOX[1] || 0.06;
            var targetD = DEFAULT_TARGET_BBOX[2] || 0.08;

            boardMesh.scale.set(
              Math.max(0.06, (targetW * 0.86) / 0.520),
              0.25,
              Math.max(0.06, (targetD * 0.86) / 0.340)

            baseFootAlias.scale.copy(boardMesh.scale);
            baseFootAlias.position.set(0, 0.001, 0);

            scaleDisplay.position.set(0, Math.min(0.015, targetH * 0.35), 0);
            scaleDisplayRear.scale.set(0.14, 0.14, 0.14);
            scaleDisplayRear.position.set(0, Math.min(0.015, targetH * 0.35), -0.002);

            componentsGroup.position.set(0, 0.002, 0);
            var toRemove = [];
            for (var i = 0; i < componentsGroup.children.length; i++) {
              var ch = componentsGroup.children[i];

                (activeFilter === 'unit_battery_holder' && (ch.name === 'unit_battery_1' || ch.name === 'unit_battery_2')) ||

              componentsGroup.remove(toRemove[j]);

                );

                proxyPlunger.position.set(0, Math.max(0.01, targetH * 0.4), 0);
                mainUnit.add(proxyPlunger);
              }

            if (activeFilter === 'unit_battery_holder') {
              if (bat1) bat1.position.set(0, 0, -0.022);
              if (bat2) bat2.position.set(0, 0, 0.022);

            if (activeFilter === 'unit_single_battery_holder_1') {
              if (bat3) bat3.position.set(0, 0, 0);

          }

          return root;
        }

        function updateEquipmentState(rootObject, state, dt) {
          if (!rootObject || !rootObject.userData) return;
          var st = state || {};
          var ud = rootObject.userData;
          var units = ud.units;
          var activeFilter = ud.activeFilter || 'ALL';
          var alpha = 1 - Math.exp(-14 * (dt || 0.016));

          var hasMultiVal = typeof st.multimeterValue === 'number';
          var multiVal = hasMultiVal ? st.multimeterValue : 4.0;

          var rheoOhm = typeof st.rheostatOhm === 'number'
            ? st.rheostatOhm
            : (activeFilter === 'ALL' || activeFilter === 'unit_rheostat' ? multiVal : 4.0);
          rheoOhm = Math.max(0, Math.min(20, rheoOhm));

          if (units.rheostat && units.rheostat.userData.wiperGroup) {
            var fracR = rheoOhm / 20.0;
            var targetX = -0.056 + fracR * 0.112;
            units.rheostat.userData.wiperGroup.position.x += (targetX - units.rheostat.userData.wiperGroup.position.x) * alpha;
          }

          var swClosed = (typeof st.switchClosed === 'boolean')
            ? st.switchClosed
            : (activeFilter === 'unit_switch' && hasMultiVal ? multiVal >= 0.5 : true);
          if (units.switch && units.switch.userData.bladePivot) {
            if (typeof st.switchBladeAngle === 'number') {
              units.switch.userData.bladePivot.rotation.z = st.switchBladeAngle;
            } else {
              var targetBladeZ = swClosed ? -0.04 : 0.72;
              var curZ = units.switch.userData.bladePivot.rotation.z;
              units.switch.userData.bladePivot.rotation.z = curZ + (targetBladeZ - curZ) * alpha;
            }
            if (activeFilter === 'unit_switch' && hasMultiVal) {
              var hl = units.switch.getObjectByName('switch_lever_highlight');
              if (hl) hl.visible = true;
            }
          }

          var bat1In = (typeof st.battery1Inserted === 'boolean')
            ? st.battery1Inserted
            : (activeFilter === 'unit_battery_holder' && hasMultiVal ? multiVal >= 1.0 : true);
          var bat2In = (typeof st.battery2Inserted === 'boolean')
            ? st.battery2Inserted
            : (activeFilter === 'unit_battery_holder' && hasMultiVal ? multiVal >= 2.5 : true);

          if (!st.disableAutoBatteryPos) {
            if (units.battery_1 && units.battery_holder && units.battery_holder.parent) {
              var hp = units.battery_holder.position;
              var targetX1 = bat1In ? hp.x : hp.x - 0.030;
              var targetZ1 = bat1In ? (hp.z - 0.022) : (hp.z - 0.085);
              units.battery_1.position.x += (targetX1 - units.battery_1.position.x) * alpha;
              units.battery_1.position.z += (targetZ1 - units.battery_1.position.z) * alpha;
              var s1hl = units.battery_holder.getObjectByName('slot1_highlight');
              if (s1hl && activeFilter === 'unit_battery_holder' && hasMultiVal) s1hl.visible = !bat1In;
            }
            if (units.battery_2 && units.battery_holder && units.battery_holder.parent) {
              var hp2 = units.battery_holder.position;
              var targetX2 = bat2In ? hp2.x : hp2.x + 0.035;
              var targetZ2 = bat2In ? (hp2.z + 0.022) : (hp2.z + 0.085);
              units.battery_2.position.x += (targetX2 - units.battery_2.position.x) * alpha;
              units.battery_2.position.z += (targetZ2 - units.battery_2.position.z) * alpha;
              var s2hl = units.battery_holder.getObjectByName('slot2_highlight');
              if (s2hl && activeFilter === 'unit_battery_holder' && hasMultiVal) s2hl.visible = !bat2In;
            }
            if (activeFilter === 'unit_single_battery_holder_1' && units.battery_3 && units.single_battery_holder_1) {
              var sbatIn = hasMultiVal ? multiVal >= 0.75 : true;
              var shp = units.single_battery_holder_1.position;
              var tx3 = sbatIn ? shp.x : shp.x;
              var tz3 = sbatIn ? shp.z : shp.z - 0.068;
              units.battery_3.position.x += (tx3 - units.battery_3.position.x) * alpha;
              units.battery_3.position.z += (tz3 - units.battery_3.position.z) * alpha;
              var shl = units.single_battery_holder_1.getObjectByName('slot_highlight');
              if (shl && hasMultiVal) shl.visible = !sbatIn;
            }
          }

          var emfV = typeof st.emfV === 'number'
            ? st.emfV
            : (activeFilter === 'unit_battery_holder' && hasMultiVal ? multiVal : ((bat1In && bat2In) ? 3.0 : (bat1In || bat2In ? 1.5 : 0.0)));
          var rBulb = typeof st.bulbResistance === 'number' ? st.bulbResistance : 4.8;
          var rInt = 0.24;
          var defaultI = (swClosed && emfV > 0) ? (emfV / (rBulb + rheoOhm + rInt + 0.05)) : 0.0;

          var currentA = typeof st.ammeterReadingA === 'number'
            ? st.ammeterReadingA
            : (activeFilter === 'unit_ammeter' && hasMultiVal ? multiVal : defaultI);
          var voltV = typeof st.voltmeterReadingV === 'number'
            ? st.voltmeterReadingV
            : (activeFilter === 'unit_voltmeter' && hasMultiVal ? multiVal : (activeFilter === 'unit_bulb' && hasMultiVal ? multiVal : (defaultI * rBulb)));
          var bulbCurrentA = typeof st.bulbCurrentA === 'number'
            ? st.bulbCurrentA
            : (activeFilter === 'unit_bulb' && hasMultiVal ? (multiVal / rBulb) : defaultI);
          var ammeterScaleMax = typeof st.ammeterMaxA === 'number' ? st.ammeterMaxA : (Math.abs(currentA) > 0.65 ? 3.0 : 0.6);
          var voltmeterScaleMax = typeof st.voltmeterMaxV === 'number' ? st.voltmeterMaxV : (Math.abs(voltV) > 6.2 ? 12.0 : 6.0);

          if (units.ammeter && units.ammeter.userData.needlePivot) {
            var normA = Math.max(-0.22, Math.min(1.25, currentA / ammeterScaleMax));
            var targetAngA = 0.83 - normA * 1.66;
            var curAngA = units.ammeter.userData.needlePivot.rotation.z;
            units.ammeter.userData.needlePivot.rotation.z = curAngA + (targetAngA - curAngA) * alpha;
          }
          if (units.voltmeter && units.voltmeter.userData.needlePivot) {
            var normV = Math.max(-0.22, Math.min(1.25, voltV / voltmeterScaleMax));
            var targetAngV = 0.83 - normV * 1.66;
            var curAngV = units.voltmeter.userData.needlePivot.rotation.z;
            units.voltmeter.userData.needlePivot.rotation.z = curAngV + (targetAngV - curAngV) * alpha;
          }

          // Độ sáng đèn tỉ lệ trực tiếp và rõ rệt với cường độ dòng điện I & công suất P = I²R
          var powerW = bulbCurrentA * bulbCurrentA * rBulb;
          var currentRatio = Math.max(0, Math.min(1.6, bulbCurrentA / 0.38));
          var glowRatio = Math.max(currentRatio * 0.85, Math.min(1.8, powerW / 0.45));
          if (units.bulb && units.bulb.userData) {
            var bud = units.bulb.userData;
            bud.filamentMat.emissiveIntensity = glowRatio * 4.5;
            bud.glassMat.emissiveIntensity = glowRatio * 1.35;
            bud.haloMat.opacity = Math.min(0.85, glowRatio * 0.62);
            bud.bulbLight.intensity = glowRatio * 2.8;
          }

          var sig = [
            (currentA || 0).toFixed(2),
            (voltV || 0).toFixed(2),
            rheoOhm.toFixed(1),
            emfV.toFixed(1),
            powerW.toFixed(2),
            bulbCurrentA > 0.02 ? '1' : '0'
          ].join('|');

          if (ud.lastSignature !== sig) {
            ud.lastSignature = sig;
            ud.drawReadoutCanvas(ud.screenCanvas, {
              closed: bulbCurrentA > 0.02,
              currentA: Math.abs(currentA),
              bulbV: Math.abs(voltV),
              rheostatOhm: rheoOhm,
              emfV: emfV,
              powerW: powerW
            });
            ud.screenTex.needsUpdate = true;
          }
        }

        function playEquipmentSound(eventType, value) {
          try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            if (!window.__ol3dAudioCtx) {
              window.__ol3dAudioCtx = new AudioCtx();
            }
            var ctx = window.__ol3dAudioCtx;
            if (ctx.state === 'suspended') ctx.resume();

            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            var now = ctx.currentTime;

            if (eventType === 'switch') {
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(value ? 520 : 340, now);
              osc.frequency.exponentialRampToValueAtTime(value ? 880 : 210, now + 0.06);
              gain.gain.setValueAtTime(0.14, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.075);
            } else if (eventType === 'plug') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(640, now);
              osc.frequency.exponentialRampToValueAtTime(980, now + 0.05);
              gain.gain.setValueAtTime(0.11, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.06);
            } else {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(300 + (Number(value) || 0) * 18, now);
              gain.gain.setValueAtTime(0.04, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.04);
            }
          } catch (e) {}
        }

        function applyEquipmentState(THREE, rootObject, instance, asset) {
          var st = instance && instance.instanceState ? instance.instanceState : (instance || {});
          updateEquipmentState(rootObject, st, 0.25);
        }

        window.OL3D_EQUIPMENT_MODULE = {
          buildEquipmentGroup: buildEquipmentMesh,
          buildEquipmentMesh: buildEquipmentMesh,
          applyEquipmentState: applyEquipmentState,
          updateEquipmentState: updateEquipmentState,
          getTerminalLocalPos: getTerminalLocalPos,
          rebuildWires3D: rebuildWires3D,
          playEquipmentSound: playEquipmentSound
        };
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
